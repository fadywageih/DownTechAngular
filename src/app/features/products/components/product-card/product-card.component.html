<div class="glass-card rounded-2xl shadow-2xl overflow-hidden transition-all duration-500 hover:transform hover:scale-105 cursor-pointer"
     (click)="onViewDetails()">
  <div class="absolute top-4 right-4 z-10">
    <span class="px-3 py-1 rounded-full text-xs font-semibold text-white" 
          [ngClass]="conditionClass">
      {{ conditionText }}
    </span>
  </div>
  <div class="img-zoom h-56 overflow-hidden">
    <img [src]="mainImageUrl" [alt]="displayName" class="w-full h-full object-cover">
  </div>
  <div class="p-6">
    <h3 class="text-xl font-bold text-gray-800 mb-2 line-clamp-1">
      {{ displayName }}
    </h3>
    <p class="text-gray-500 text-sm line-clamp-2 mb-3">
      <i class="fas fa-microchip mr-2"></i> {{ getSpecsSummary() }}
    </p>
    <p class="text-indigo-600 font-bold text-2xl mb-4">
      {{ price }}
    </p>
    <div class="flex gap-3">
      <button (click)="onAddToCart($event)" 
              class="flex-1 bg-blue-800 hover:bg-blue-900 text-white py-3 rounded-xl transition-all font-semibold flex items-center justify-center gap-2 shadow-lg hover:shadow-xl">
        <i class="fas fa-shopping-cart"></i>
        {{ currentLang === 'en' ? 'Get it now' : 'احصل عليه الآن' }}
      </button>
    </div>
  </div>
</div>
