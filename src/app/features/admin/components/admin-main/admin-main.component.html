<app-admin-header></app-admin-header>
<div class="min-h-screen bg-gradient-to-br from-blue-900 via-purple-900 to-indigo-900">
  <!-- Animated Background -->
  <div class="fixed inset-0 opacity-20">
    <div class="absolute top-20 left-10 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
    <div class="absolute top-40 right-20 w-72 h-72 bg-yellow-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-4000"></div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 relative z-10">
    <!-- Admin Header -->
    <header class="glass-header rounded-3xl shadow-2xl px-6 py-4 mb-8 mt-20 transition-all" data-aos="fade-down">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3 cursor-pointer group">
          <i class="fas fa-user-shield text-4xl text-indigo-600 group-hover:animate-bounce transition-all"></i>
          <div>
            <span class="text-2xl font-extrabold gradient-text">Admin Panel</span>
            <p class="text-white/70 text-sm">{{ adminName }}</p>
          </div>
        </div>
        
        <!-- Admin Nav Tabs -->
        <div class="hidden md:flex flex-wrap gap-2 bg-white/50 backdrop-blur-sm p-1.5 rounded-full">
          <button (click)="switchSection('dashboard')" class="nav-btn px-5 py-2.5 rounded-full font-semibold text-gray-700 hover:bg-indigo-100 transition-all flex items-center gap-2" [class.active-nav]="currentSection === 'dashboard'">
            <i class="fas fa-tachometer-alt text-lg"></i> {{ currentLang === 'en' ? 'Dashboard' : 'لوحة التحكم' }}
          </button>
          <button (click)="switchSection('laptops')" class="nav-btn px-5 py-2.5 rounded-full font-semibold text-gray-700 hover:bg-indigo-100 transition-all flex items-center gap-2" [class.active-nav]="currentSection === 'laptops'">
            <i class="fas fa-laptop text-lg"></i> {{ currentLang === 'en' ? 'Laptops' : 'لابتوبات' }}
          </button>
          <button (click)="switchSection('maintenance')" class="nav-btn px-5 py-2.5 rounded-full font-semibold text-gray-700 hover:bg-indigo-100 transition-all flex items-center gap-2" [class.active-nav]="currentSection === 'maintenance'">
            <i class="fas fa-tools text-lg"></i> {{ currentLang === 'en' ? 'Maintenance' : 'الصيانة' }}
          </button>
          <button (click)="switchSection('software')" class="nav-btn px-5 py-2.5 rounded-full font-semibold text-gray-700 hover:bg-indigo-100 transition-all flex items-center gap-2" [class.active-nav]="currentSection === 'software'">
            <i class="fas fa-code text-lg"></i> {{ currentLang === 'en' ? 'Software' : 'برمجيات' }}
          </button>
          <button routerLink="/admin/admins" class="nav-btn px-5 py-2.5 rounded-full font-semibold text-gray-700 hover:bg-indigo-100 transition-all flex items-center gap-2">
            <i class="fas fa-users text-lg"></i> {{ currentLang === 'en' ? 'Admins' : 'مشرفين' }}
          </button>
        </div>

        <!-- Right side: Logout -->
        <div class="flex items-center gap-3">
          <button (click)="logout()" class="bg-red-500/20 hover:bg-red-500/30 text-red-100 px-4 py-2 rounded-xl font-semibold transition-all flex items-center gap-2">
            <i class="fas fa-sign-out-alt"></i>
            {{ currentLang === 'en' ? 'Logout' : 'تسجيل خروج' }}
          </button>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="min-h-[70vh]">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
