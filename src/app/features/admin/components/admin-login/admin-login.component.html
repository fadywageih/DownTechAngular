<div class="min-h-screen bg-gradient-to-br from-blue-900 via-purple-900 to-indigo-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/20 p-8">
    <div class="text-center mb-8">
<h1 class="text-4xl font-bold text-gray-800 mb-2">
  Admin Panel
</h1>
      <p class="text-white/70 text-lg">Sign in to your admin account</p>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-white mb-2">Email</label>
        <div class="relative">
          <input 
            type="email" 
            formControlName="email"
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            [class]="email?.invalid && email?.touched ? 'border-red-500' : ''"
            placeholder="Enter your email">
          <div *ngIf="email?.invalid && email?.touched" class="text-red-400 text-sm mt-1">
            Email is required and must be valid
          </div>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-white mb-2">Password</label>
        <div class="relative">
          <input 
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all pr-12"
            [class]="password?.invalid && password?.touched ? 'border-red-500' : ''"
            placeholder="Enter your password">
          <button 
            type="button" 
            (click)="togglePasswordVisibility()"
            class="absolute right-3 top-3 text-white/70 hover:text-white transition-colors">
            <i *ngIf="!showPassword" class="fas fa-eye"></i>
            <i *ngIf="showPassword" class="fas fa-eye-slash"></i>
          </button>
          <div *ngIf="password?.invalid && password?.touched" class="text-red-400 text-sm mt-1">
            Password is required (min 6 characters)
          </div>
        </div>
      </div>
      <div *ngIf="errorMessage" class="bg-red-500/20 border border-red-500/50 text-red-100 p-4 rounded-xl">
        {{ errorMessage }}
      </div>
      <button 
        type="submit" 
        class="w-full bg-black text-white font-semibold py-3 px-4 rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center space-x-2"
        [disabled]="isLoading || loginForm.invalid">
        <span *ngIf="!isLoading">Sign In</span>
        <div *ngIf="isLoading" class="flex items-center space-x-2">
          <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          <span>Signing In...</span>
        </div>
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-white/60">
      <p>Don't have admin access? Contact Super Admin</p>
    </div>
  </div>
</div>
