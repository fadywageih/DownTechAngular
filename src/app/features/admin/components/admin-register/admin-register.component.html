<div class="min-h-screen bg-gradient-to-br from-blue-900 via-purple-900 to-indigo-900 flex items-center justify-center p-4">
  <div class="w-full max-w-lg bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/20 p-8">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent mb-2">
        Admin Registration
      </h1>
      <p class="text-white/70 text-lg">Create new admin account (SuperAdmin only)</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="grid grid-cols-2 gap-4">
        <!-- First Name -->
        <div>
          <label class="block text-sm font-medium text-white mb-2">First Name</label>
          <input 
            type="text"
            formControlName="firstName"
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            [class]="firstName?.invalid && firstName?.touched ? 'border-red-500' : ''"
            placeholder="First name">
          <div *ngIf="firstName?.invalid && firstName?.touched" class="text-red-400 text-sm mt-1">
            First name is required (2-50 chars)
          </div>
        </div>

        <!-- Last Name -->
        <div>
          <label class="block text-sm font-medium text-white mb-2">Last Name</label>
          <input 
            type="text"
            formControlName="lastName"
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            [class]="lastName?.invalid && lastName?.touched ? 'border-red-500' : ''"
            placeholder="Last name">
          <div *ngIf="lastName?.invalid && lastName?.touched" class="text-red-400 text-sm mt-1">
            Last name is required (2-50 chars)
          </div>
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-white mb-2">Email</label>
        <input 
          type="email"
          formControlName="email"
          class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          [class]="email?.invalid && email?.touched ? 'border-red-500' : ''"
          placeholder="Enter your email">
        <div *ngIf="email?.invalid && email?.touched" class="text-red-400 text-sm mt-1">
          Valid email is required
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-white mb-2">Password</label>
        <div class="relative">
          <input 
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all pr-12"
            [class]="password?.invalid && password?.touched ? 'border-red-500' : ''"
            placeholder="Minimum 6 characters">
          <button 
            type="button" 
            (click)="togglePasswordVisibility('password')"
            class="absolute right-3 top-3 text-white/70 hover:text-white transition-colors">
            <i *ngIf="!showPassword" class="fas fa-eye"></i>
            <i *ngIf="showPassword" class="fas fa-eye-slash"></i>
          </button>
          <div *ngIf="password?.invalid && password?.touched" class="text-red-400 text-sm mt-1">
            Password must be at least 6 characters
          </div>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-sm font-medium text-white mb-2">Confirm Password</label>
        <div class="relative">
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all pr-12"
            [class]="confirmPassword?.invalid && confirmPassword?.touched ? 'border-red-500' : ''"
            placeholder="Confirm your password">
          <button 
            type="button" 
            (click)="togglePasswordVisibility('confirm')"
            class="absolute right-3 top-3 text-white/70 hover:text-white transition-colors">
            <i *ngIf="!showConfirmPassword" class="fas fa-eye"></i>
            <i *ngIf="showConfirmPassword" class="fas fa-eye-slash"></i>
          </button>
          <div *ngIf="confirmPassword?.invalid && confirmPassword?.touched" class="text-red-400 text-sm mt-1">
            <span *ngIf="confirmPassword?.errors?.['required']">Confirm password is required</span>
            <span *ngIf="registerForm.errors?.['mismatch']">Passwords do not match</span>
          </div>
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="bg-red-500/20 border border-red-500/50 text-red-100 p-4 rounded-xl">
        {{ errorMessage }}
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full bg-gradient-to-r from-green-500 to-blue-600 hover:from-green-600 hover:to-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center space-x-2"
        [disabled]="isLoading || registerForm.invalid">
        <span *ngIf="!isLoading">Create Admin</span>
        <div *ngIf="isLoading" class="flex items-center space-x-2">
          <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          <span>Creating...</span>
        </div>
      </button>
    </form>

    <div class="mt-6 text-center space-y-2">
      <button routerLink="/admin/login" class="text-blue-400 hover:text-blue-300 text-sm font-medium underline">
        ← Back to Login
      </button>
    </div>
  </div>
</div>
